name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Installs Node, runs the frontend tests and build, then the backend tests, and packages one JAR.
      - name: Build and test
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dnpm.install.command=ci

      - uses: actions/upload-artifact@v4
        with:
          name: medcamp-feedback-jar
          path: backend/target/medcamp-feedback.jar
          retention-days: 14
