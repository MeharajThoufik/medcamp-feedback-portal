spring.application.name=medcamp-feedback
spring.profiles.default=dev

# Optional machine-specific overrides (git-ignored); see application-local.properties.example
spring.config.import=optional:file:./application-local.properties

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

server.port=8080
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Base address printed inside QR codes; for the Windows hotspot use http://192.168.137.1:8080
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Camp dates and feedback windows are calendar days in this time zone
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# First Super Admin, created only when the users table is empty
app.bootstrap.admin.email=${APP_ADMIN_EMAIL:admin@medcamp.local}
app.bootstrap.admin.full-name=System Administrator
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}

app.security.max-failed-logins=5
app.security.lockout-duration=15m

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
