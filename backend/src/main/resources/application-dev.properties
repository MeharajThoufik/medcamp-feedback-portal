# Local development: file-based H2 database in backend/data (no install needed)
spring.datasource.url=jdbc:h2:file:./data/medcamp-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Dev-only default; the admin must change it on first login
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
