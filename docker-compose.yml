# Optional: PostgreSQL for the "prod" profile. The app itself runs directly with java -jar.
#   DB_PASSWORD=choose-one docker compose up -d db
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcamp
      POSTGRES_USER: medcamp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the database}
    ports:
      - "5432:5432"
    volumes:
      - medcamp-db:/var/lib/postgresql/data

volumes:
  medcamp-db:
